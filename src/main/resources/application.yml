spring:
  application:
    name: jaxon-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${JAXON_DB_URL}
    username: ${JAXON_DB_USERNAME}
    password: ${JAXON_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

jaxon:
  environment: ${JAXON_ENVIRONMENT:local}
  identity:
    frontend-origin: ${JAXON_FRONTEND_ORIGIN:http://localhost:3000}
    bootstrap:
      enabled: ${JAXON_IDENTITY_BOOTSTRAP_ENABLED:false}
      username: ${JAXON_IDENTITY_BOOTSTRAP_USERNAME:}
      password: ${JAXON_IDENTITY_BOOTSTRAP_PASSWORD:}

logging:
  structured:
    format:
      console: ${JAXON_LOG_FORMAT:logstash}
    json:
      add:
        service.name: ${spring.application.name}
        service.environment: ${jaxon.environment}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${jaxon.environment}
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${JAXON_TRACING_SAMPLING_PROBABILITY:0.10}
    export:
      otlp:
        enabled: ${JAXON_TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
      export:
        otlp:
          endpoint: ${JAXON_TRACING_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: ${JAXON_TRACING_OTLP_TIMEOUT:5s}
