spring:
  application:
    name: jaxon-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${JAXON_DB_URL}
    username: ${JAXON_DB_USERNAME}
    password: ${JAXON_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 1048576B
      max-request-size: 1052672B

jaxon:
  environment: ${JAXON_ENVIRONMENT:local}
  ai:
    document-storage:
      root: ${JAXON_AI_DOCUMENT_STORAGE_ROOT:}
    embedding:
      model-path: ${JAXON_AI_EMBEDDING_MODEL_PATH:}
      tokenizer-path: ${JAXON_AI_EMBEDDING_TOKENIZER_PATH:}
    indexing:
      concurrency: ${JAXON_AI_INDEXING_CONCURRENCY:1}
      poll-interval: ${JAXON_AI_INDEXING_POLL_INTERVAL:1s}
      claim-timeout: ${JAXON_AI_INDEXING_CLAIM_TIMEOUT:10m}
      batch-size: ${JAXON_AI_INDEXING_BATCH_SIZE:16}
    audit-dispatch:
      enabled: ${JAXON_AI_AUDIT_DISPATCH_ENABLED:true}
      poll-interval: ${JAXON_AI_AUDIT_DISPATCH_POLL_INTERVAL:1s}
      batch-size: ${JAXON_AI_AUDIT_DISPATCH_BATCH_SIZE:50}
  identity:
    frontend-origin: ${JAXON_FRONTEND_ORIGIN:http://localhost:3000}
    audit-dispatch:
      enabled: ${JAXON_IDENTITY_AUDIT_DISPATCH_ENABLED:true}
      poll-interval: ${JAXON_IDENTITY_AUDIT_DISPATCH_POLL_INTERVAL:1s}
      batch-size: ${JAXON_IDENTITY_AUDIT_DISPATCH_BATCH_SIZE:50}
    bootstrap:
      enabled: ${JAXON_IDENTITY_BOOTSTRAP_ENABLED:false}
      username: ${JAXON_IDENTITY_BOOTSTRAP_USERNAME:}
      password: ${JAXON_IDENTITY_BOOTSTRAP_PASSWORD:}
  automation:
    execution:
      enabled: ${JAXON_AUTOMATION_EXECUTION_ENABLED:true}
      poll-interval: ${JAXON_AUTOMATION_EXECUTION_POLL_INTERVAL:1s}
      batch-size: ${JAXON_AUTOMATION_EXECUTION_BATCH_SIZE:50}
    audit-dispatch:
      enabled: ${JAXON_AUTOMATION_AUDIT_DISPATCH_ENABLED:true}
      poll-interval: ${JAXON_AUTOMATION_AUDIT_DISPATCH_POLL_INTERVAL:1s}
      batch-size: ${JAXON_AUTOMATION_AUDIT_DISPATCH_BATCH_SIZE:50}
  support:
    automation-dispatch:
      enabled: ${JAXON_SUPPORT_AUTOMATION_DISPATCH_ENABLED:true}
      poll-interval: ${JAXON_SUPPORT_AUTOMATION_DISPATCH_POLL_INTERVAL:1s}
      batch-size: ${JAXON_SUPPORT_AUTOMATION_DISPATCH_BATCH_SIZE:50}
  sftp:
    enabled: ${JAXON_SFTP_ENABLED:false}
    admin-api-url: ${JAXON_SFTPGO_ADMIN_API_URL:}
    admin-username: ${JAXON_SFTPGO_ADMIN_USERNAME:}
    admin-password: ${JAXON_SFTPGO_ADMIN_PASSWORD:}
    public-host: ${JAXON_SFTP_PUBLIC_HOST:}
    public-port: ${JAXON_SFTP_PUBLIC_PORT:2022}
    public-host-key: ${JAXON_SFTP_PUBLIC_HOST_KEY:}
    connect-timeout: ${JAXON_SFTPGO_CONNECT_TIMEOUT:5s}
    request-timeout: ${JAXON_SFTPGO_REQUEST_TIMEOUT:10s}
  discovery:
    audit-dispatch:
      enabled: ${JAXON_DISCOVERY_AUDIT_DISPATCH_ENABLED:true}
      poll-interval: ${JAXON_DISCOVERY_AUDIT_DISPATCH_POLL_INTERVAL:1s}
      batch-size: ${JAXON_DISCOVERY_AUDIT_DISPATCH_BATCH_SIZE:50}
    jobs:
      publication-root: ${JAXON_DISCOVERY_JOB_PUBLICATION_ROOT:}
      reconciliation-interval: ${JAXON_DISCOVERY_JOB_RECONCILIATION_INTERVAL:5m}
    results:
      mailbox-root: ${JAXON_DISCOVERY_RESULT_MAILBOX_ROOT:}
      stability-age: ${JAXON_DISCOVERY_RESULT_STABILITY_AGE:2s}
      batch-size: ${JAXON_DISCOVERY_RESULT_BATCH_SIZE:100}
  collector:
    agent-operational-status:
      offline-threshold: ${JAXON_COLLECTOR_AGENT_OFFLINE_THRESHOLD:5m}
    snapshot-ingestion:
      mailbox-root: ${JAXON_COLLECTOR_MAILBOX_ROOT:}
      reconciliation-interval: ${JAXON_COLLECTOR_RECONCILIATION_INTERVAL:5m}
      stability-age: ${JAXON_COLLECTOR_SNAPSHOT_STABILITY_AGE:2s}
      batch-size: ${JAXON_COLLECTOR_SNAPSHOT_BATCH_SIZE:100}
    tasks:
      publication-root: ${JAXON_COLLECTOR_TASK_PUBLICATION_ROOT:}
      reconciliation-interval: ${JAXON_COLLECTOR_TASK_RECONCILIATION_INTERVAL:5m}
    task-results:
      mailbox-root: ${JAXON_COLLECTOR_MAILBOX_ROOT:}
      stability-age: ${JAXON_COLLECTOR_RESULT_STABILITY_AGE:2s}
      batch-size: ${JAXON_COLLECTOR_RESULT_BATCH_SIZE:100}
    technical-state-events:
      global-connection-limit: ${JAXON_COLLECTOR_SSE_GLOBAL_CONNECTION_LIMIT:100}
      user-connection-limit: ${JAXON_COLLECTOR_SSE_USER_CONNECTION_LIMIT:3}
      heartbeat-interval: ${JAXON_COLLECTOR_SSE_HEARTBEAT_INTERVAL:15s}
      timeout: ${JAXON_COLLECTOR_SSE_TIMEOUT:60s}

logging:
  structured:
    format:
      console: ${JAXON_LOG_FORMAT:logstash}
    json:
      add:
        service.name: ${spring.application.name}
        service.environment: ${jaxon.environment}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${jaxon.environment}
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${JAXON_TRACING_SAMPLING_PROBABILITY:0.10}
    export:
      otlp:
        enabled: ${JAXON_TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
      export:
        otlp:
          endpoint: ${JAXON_TRACING_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
          timeout: ${JAXON_TRACING_OTLP_TIMEOUT:5s}
