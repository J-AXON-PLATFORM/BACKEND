spring:
  application:
    name: jaxon-backend
  datasource:
    url: ${JAXON_DB_URL}
    username: ${JAXON_DB_USERNAME}
    password: ${JAXON_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
