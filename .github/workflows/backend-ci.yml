name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      risk_level:
        description: Verification level
        type: choice
        required: true
        default: PLATFORM_FULL
        options: [PLATFORM_FULL, APPLICATION, DOCS_ONLY]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify CI risk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      level: ${{ steps.classify.outputs.level }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify classifier
        run: ./scripts/ci/test-classify-changes.sh

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_LEVEL: ${{ inputs.risk_level }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_paths="${RUNNER_TEMP}/changed-paths.txt"
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              printf 'level=%s\n' "${DISPATCH_LEVEL:-PLATFORM_FULL}" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            pull_request)
              git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > "${changed_paths}"
              ;;
            push)
              mapfile -t pr_numbers < <(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
                --jq '.[] | select(.merged_at != null and .base.ref == "develop") | .number')
              if (( ${#pr_numbers[@]} != 1 )); then
                printf 'level=PLATFORM_FULL\n' >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              pr_number="${pr_numbers[0]}"
              merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.merge_commit_sha')"
              if [[ "${merge_sha}" != "${GITHUB_SHA}" ]]; then
                printf 'level=PLATFORM_FULL\n' >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
                --jq '.[].filename' > "${changed_paths}"
              ;;
            *)
              printf 'level=PLATFORM_FULL\n' >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          ./scripts/ci/classify-changes.sh "${changed_paths}"

  backend-verification:
    name: Backend verification
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_LEVEL: ${{ needs.classify.outputs.level }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${archive_path}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive_path}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive_path}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact=100 --verbose .

      - name: Set up Java 25
        if: env.CI_LEVEL != 'DOCS_ONLY'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate local Compose configuration
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: docker compose --env-file .env.example config --quiet

      - name: Build PostgreSQL pgvector test fixture
        if: env.CI_LEVEL != 'DOCS_ONLY'
        run: docker build --file docker/postgres-pgvector.Dockerfile --tag jaxon-postgres-pgvector-test:18.6-0.8.6 .

      - name: Scan PostgreSQL pgvector test fixture
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress
          jaxon-postgres-pgvector-test:18.6-0.8.6

      - name: Verify Local/Test SFTPGo build cache key
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: |
          ./docker/sftpgo/verify-cache-key.sh
          ./docker/sftpgo/verify-cache-integrity.sh

      - name: Calculate Local/Test SFTPGo build cache key
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        id: sftpgo-cache-key
        run: printf 'key=%s\n' "$(./docker/sftpgo/cache-key.sh linux/amd64)" >> "${GITHUB_OUTPUT}"

      - name: Restore Local/Test SFTPGo build cache
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        id: sftpgo-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jaxon-sftpgo-build-cache
          key: ${{ steps.sftpgo-cache-key.outputs.key }}

      - name: Prepare Local/Test SFTPGo build cache
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        env:
          SFTPGO_CACHE_HIT: ${{ steps.sftpgo-cache.outputs.cache-hit }}
        run: |
          if [[ "${SFTPGO_CACHE_HIT}" != "true" ]]; then
            rm -rf /tmp/jaxon-sftpgo-build-cache
          fi
          mkdir -p /tmp/jaxon-sftpgo-build-cache

      - name: Build and verify Local/Test SFTPGo fixture
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        env:
          SFTPGO_BUILD_CACHE_DIR: /tmp/jaxon-sftpgo-build-cache
          SFTPGO_BUILD_CACHE_READ_ONLY: ${{ steps.sftpgo-cache.outputs.cache-hit == 'true' }}
          SFTPGO_BUILD_PLATFORM: linux/amd64
        run: ./docker/sftpgo/build-local.sh

      - name: Save Local/Test SFTPGo build cache
        if: env.CI_LEVEL == 'PLATFORM_FULL' && steps.sftpgo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jaxon-sftpgo-build-cache
          key: ${{ steps.sftpgo-cache-key.outputs.key }}

      - name: Release SFTPGo build cache
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: docker builder prune --all --force

      - name: Verify backend application
        if: env.CI_LEVEL != 'DOCS_ONLY'
        run: |
          if [[ "${CI_LEVEL}" == "APPLICATION" ]]; then
            ./mvnw --batch-mode --no-transfer-progress -DexcludedGroups=sftpgo clean verify
          else
            ./mvnw --batch-mode --no-transfer-progress clean verify
          fi

      - name: Verify OpenAPI compatibility
        if: env.CI_LEVEL != 'DOCS_ONLY'
        run: ./scripts/verify-openapi.sh

      - name: Build backend container
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag jaxon-backend:ci .

      - name: Verify backend container
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: ./scripts/verify-container.sh jaxon-backend:ci jaxon-postgres-pgvector-test:18.6-0.8.6

      - name: Verify local Compose baseline
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: ./scripts/verify-compose.sh jaxon-postgres-pgvector-test:18.6-0.8.6 jaxon-backend:ci

      - name: Verify PostgreSQL logical backup and restore
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: ./scripts/verify-postgresql-backup-restore.sh jaxon-postgres-pgvector-test:18.6-0.8.6 jaxon-backend:ci

      - name: Scan backend container
        if: env.CI_LEVEL == 'PLATFORM_FULL'
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress
          jaxon-backend:ci
