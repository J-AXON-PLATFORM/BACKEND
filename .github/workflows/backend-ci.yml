name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate local Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build PostgreSQL pgvector test fixture
        run: >-
          docker build
          --file docker/postgres-pgvector.Dockerfile
          --tag jaxon-postgres-pgvector-test:18.6-0.8.6
          .

      - name: Scan PostgreSQL pgvector test fixture
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress
          jaxon-postgres-pgvector-test:18.6-0.8.6

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build backend container
        run: >-
          docker build
          --build-arg VCS_REF=${{ github.sha }}
          --tag jaxon-backend:ci
          .

      - name: Verify backend container
        run: ./scripts/verify-container.sh jaxon-backend:ci jaxon-postgres-pgvector-test:18.6-0.8.6

      - name: Verify local Compose baseline
        run: ./scripts/verify-compose.sh jaxon-postgres-pgvector-test:18.6-0.8.6 jaxon-backend:ci

      - name: Scan backend container
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --no-progress
          jaxon-backend:ci
