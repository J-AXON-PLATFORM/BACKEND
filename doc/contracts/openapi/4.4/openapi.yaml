openapi: 3.1.2
info:
  title: J-AXON API
  version: "4.4"
  description: >-
    Minor compatible que conserva OpenAPI 4.3 y añade administración y consulta
    de ámbitos autorizados para Discovery.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Identity
  - name: Assets
  - name: Agents
  - name: Support
  - name: Discovery
paths:
  /auth/login: { $ref: "../4.3/openapi.yaml#/paths/~1auth~1login" }
  /auth/me: { $ref: "../4.3/openapi.yaml#/paths/~1auth~1me" }
  /auth/logout: { $ref: "../4.3/openapi.yaml#/paths/~1auth~1logout" }
  /users: { $ref: "../4.3/openapi.yaml#/paths/~1users" }
  /assets: { $ref: "../4.3/openapi.yaml#/paths/~1assets" }
  /assets/{assetId}: { $ref: "../4.3/openapi.yaml#/paths/~1assets~1%7BassetId%7D" }
  /assets/{assetId}/technical-state: { $ref: "../4.3/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state" }
  /assets/{assetId}/technical-state/events: { $ref: "../4.3/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state~1events" }
  /agents: { $ref: "../4.3/openapi.yaml#/paths/~1agents" }
  /agents/{agentId}: { $ref: "../4.3/openapi.yaml#/paths/~1agents~1%7BagentId%7D" }
  /agents/{agentId}/ssh-key: { $ref: "../4.3/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1ssh-key" }
  /agents/{agentId}/activate: { $ref: "../4.3/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1activate" }
  /agents/{agentId}/tasks: { $ref: "../4.3/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks" }
  /agents/{agentId}/tasks/{taskId}: { $ref: "../4.3/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks~1%7BtaskId%7D" }
  /tickets: { $ref: "../4.3/openapi.yaml#/paths/~1tickets" }
  /tickets/technician-queue: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1technician-queue" }
  /tickets/technician-queue/{ticketId}: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D" }
  /tickets/technician-queue/{ticketId}/comments: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1comments" }
  /tickets/technician-queue/{ticketId}/conversation: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1conversation" }
  /tickets/technician-queue/{ticketId}/lifecycle: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1lifecycle" }
  /tickets/{ticketId}: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D" }
  /tickets/{ticketId}/comments: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1comments" }
  /tickets/{ticketId}/claim: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1claim" }
  /tickets/{ticketId}/priority: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1priority" }
  /tickets/{ticketId}/status: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1status" }
  /tickets/{ticketId}/resolve: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1resolve" }
  /tickets/{ticketId}/close: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1close" }
  /tickets/{ticketId}/reopen: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1reopen" }
  /tickets/{ticketId}/lifecycle: { $ref: "../4.3/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1lifecycle" }
  /discovery/scopes:
    get:
      tags: [Discovery]
      operationId: listAuthorizedScopes
      summary: Lista ámbitos visibles para el rol actual
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Página ordenada por nombre e identificador ascendentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedScopePage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Discovery]
      operationId: createAuthorizedScope
      summary: Crea un ámbito autorizado activo
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizedScopeCreateRequest" }
      responses:
        "201":
          description: Ámbito y evento durable creados atómicamente
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedScope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /discovery/scopes/{scopeId}:
    get:
      tags: [Discovery]
      operationId: getAuthorizedScope
      summary: Consulta un ámbito visible para el rol actual
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "200":
          description: Ámbito autorizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedScope" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /discovery/scopes/{scopeId}/status:
    put:
      tags: [Discovery]
      operationId: updateAuthorizedScopeStatus
      summary: Cambia el estado de un ámbito con versión esperada
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizedScopeStatusRequest" }
      responses:
        "200":
          description: Ámbito actualizado o no-op con versión vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedScope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    SessionCookie: { $ref: "../4.3/openapi.yaml#/components/securitySchemes/SessionCookie" }
  parameters:
    CsrfToken: { $ref: "../4.3/openapi.yaml#/components/parameters/CsrfToken" }
    ScopeId:
      name: scopeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  schemas:
    AuthorizedScopeCreateRequest:
      type: object
      required: [name, cidr]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        cidr: { type: string, minLength: 3, maxLength: 64 }
      additionalProperties: false
    AuthorizedScopeStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
        expectedVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    AuthorizedScope:
      type: object
      required: [scopeId, name, cidr, status, createdByUserId, createdAt, updatedAt, version]
      properties:
        scopeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        cidr: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
      additionalProperties: false
    AuthorizedScopePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuthorizedScope" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../4.3/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../4.3/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../4.3/openapi.yaml#/components/responses/Forbidden" }
    NotFound: { $ref: "../4.3/openapi.yaml#/components/responses/NotFound" }
    Conflict: { $ref: "../4.3/openapi.yaml#/components/responses/Conflict" }
    ValidationFailed: { $ref: "../4.3/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../4.3/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../4.3/openapi.yaml#/components/responses/ServiceUnavailable" }
security:
  - SessionCookie: []
