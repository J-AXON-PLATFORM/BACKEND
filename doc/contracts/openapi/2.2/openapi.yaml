openapi: 3.1.2
info:
  title: J-AXON API
  version: "2.2"
  description: >-
    Minor compatible que conserva OpenAPI 2.1 y amplía la respuesta humana del
    Agent con estado operativo derivado y evidencia temporal de contacto válido.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Assets
  - name: Agents
paths:
  /auth/login:
    $ref: "../2.1/openapi.yaml#/paths/~1auth~1login"
  /auth/me:
    $ref: "../2.1/openapi.yaml#/paths/~1auth~1me"
  /assets:
    $ref: "../2.1/openapi.yaml#/paths/~1assets"
  /assets/{assetId}:
    $ref: "../2.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D"
  /assets/{assetId}/technical-state:
    $ref: "../2.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state"
  /assets/{assetId}/technical-state/events:
    $ref: "../2.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state~1events"
  /agents:
    post:
      tags: [Agents]
      operationId: preRegisterAgent
      summary: Pre-registra un Agent vinculado a un activo existente
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreateRequest"
      responses:
        "201":
          description: Agent pre-registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}:
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Consulta los estados administrativo y operativo derivados del Agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Estado administrativo y evidencia operativa del Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}/ssh-key:
    put:
      tags: [Agents]
      operationId: registerAgentSshKey
      summary: Registra o confirma la clave pública Ed25519 del Agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSshKeyRequest"
      responses:
        "200":
          description: Clave pública registrada o confirmada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}/activate:
    $ref: "../2.1/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1activate"
components:
  securitySchemes:
    SessionCookie:
      $ref: "../2.1/openapi.yaml#/components/securitySchemes/SessionCookie"
  parameters:
    AgentId:
      $ref: "../2.0/openapi.yaml#/components/parameters/AgentId"
    CsrfToken:
      $ref: "../2.0/openapi.yaml#/components/parameters/CsrfToken"
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    UtcDateTime:
      type: string
      format: date-time
      pattern: "Z$"
    AgentCreateRequest:
      $ref: "../2.0/openapi.yaml#/components/schemas/AgentCreateRequest"
    AgentSshKeyRequest:
      $ref: "../2.0/openapi.yaml#/components/schemas/AgentSshKeyRequest"
    AgentResponse:
      type: object
      required:
        - agentId
        - assetId
        - status
        - operationalStatus
        - lastSeenAt
        - lastSnapshotAt
        - publicKeyRegistered
        - publicKeyFingerprint
        - createdAt
        - updatedAt
        - version
      properties:
        agentId: { $ref: "#/components/schemas/UuidV4" }
        assetId: { $ref: "#/components/schemas/UuidV4" }
        status:
          type: string
          description: Estado administrativo persistido del Agent.
          enum: [PENDING, ACTIVE]
        operationalStatus:
          type: string
          description: >-
            Estado derivado en lectura. UNKNOWN no tiene contacto válido; ONLINE
            está dentro del umbral configurado; OFFLINE lo supera y no implica error.
          enum: [UNKNOWN, ONLINE, OFFLINE]
        lastSeenAt:
          description: Recepción UTC más reciente de un snapshot aceptado.
          oneOf:
            - $ref: "#/components/schemas/UtcDateTime"
            - type: "null"
        lastSnapshotAt:
          description: Captura UTC más reciente entre los snapshots aceptados.
          oneOf:
            - $ref: "#/components/schemas/UtcDateTime"
            - type: "null"
        publicKeyRegistered:
          type: boolean
        publicKeyFingerprint:
          type: [string, "null"]
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        createdAt: { $ref: "#/components/schemas/UtcDateTime" }
        updatedAt: { $ref: "#/components/schemas/UtcDateTime" }
        version:
          type: integer
          minimum: 0
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../2.0/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../2.0/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../2.0/openapi.yaml#/components/responses/Forbidden" }
    NotFound: { $ref: "../2.0/openapi.yaml#/components/responses/NotFound" }
    Conflict: { $ref: "../2.0/openapi.yaml#/components/responses/Conflict" }
    ValidationFailed: { $ref: "../2.0/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../2.0/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../2.0/openapi.yaml#/components/responses/ServiceUnavailable" }
security:
  - SessionCookie: []
