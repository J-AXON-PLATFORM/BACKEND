openapi: 3.1.2
info:
  title: J-AXON API
  version: "2.0"
  description: >-
    Versión major que conserva las operaciones de OpenAPI 1.1, amplía el estado
    del Agent y añade activación idempotente con aprovisionamiento SFTP controlado.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Assets
  - name: Agents
paths:
  /auth/login:
    $ref: "../1.1/openapi.yaml#/paths/~1auth~1login"
  /auth/me:
    $ref: "../1.1/openapi.yaml#/paths/~1auth~1me"
  /assets:
    $ref: "../1.1/openapi.yaml#/paths/~1assets"
  /assets/{assetId}:
    $ref: "../1.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D"
  /assets/{assetId}/technical-state:
    $ref: "../1.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state"
  /agents:
    post:
      tags: [Agents]
      operationId: preRegisterAgent
      summary: Pre-registra un Agent vinculado a un activo existente
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreateRequest"
      responses:
        "201":
          description: Agent pre-registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}:
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Consulta el estado oficial de un Agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Estado oficial del Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}/ssh-key:
    put:
      tags: [Agents]
      operationId: registerAgentSshKey
      summary: Registra o confirma la clave pública Ed25519 del Agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSshKeyRequest"
      responses:
        "200":
          description: Clave pública registrada o confirmada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /agents/{agentId}/activate:
    post:
      tags: [Agents]
      operationId: activateAgent
      summary: Activa un Agent y confirma su buzón SFTP lógico
      description: >-
        Operación idempotente para un Agent PENDING con clave pública. Provisiona
        mediante la API administrativa oficial de SFTPGo y no expone secretos.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Agent activado o activación existente reconciliada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActivationResponse"
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    SessionCookie:
      $ref: "../1.1/openapi.yaml#/components/securitySchemes/SessionCookie"
  parameters:
    AgentId:
      $ref: "../1.1/openapi.yaml#/components/parameters/AgentId"
    CsrfToken:
      $ref: "../1.1/openapi.yaml#/components/parameters/CsrfToken"
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    UtcDateTime:
      type: string
      format: date-time
      pattern: "Z$"
    AgentCreateRequest:
      $ref: "../1.1/openapi.yaml#/components/schemas/AgentCreateRequest"
    AgentSshKeyRequest:
      $ref: "../1.1/openapi.yaml#/components/schemas/AgentSshKeyRequest"
    AgentResponse:
      type: object
      required:
        - agentId
        - assetId
        - status
        - publicKeyRegistered
        - publicKeyFingerprint
        - createdAt
        - updatedAt
        - version
      properties:
        agentId: { $ref: "#/components/schemas/UuidV4" }
        assetId: { $ref: "#/components/schemas/UuidV4" }
        status:
          type: string
          enum: [PENDING, ACTIVE]
        publicKeyRegistered:
          type: boolean
        publicKeyFingerprint:
          type: [string, "null"]
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        createdAt: { $ref: "#/components/schemas/UtcDateTime" }
        updatedAt: { $ref: "#/components/schemas/UtcDateTime" }
        version:
          type: integer
          minimum: 0
      additionalProperties: false
    AgentActivationResponse:
      type: object
      required: [host, port, username, publicHostKey]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          pattern: "^agent-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        publicHostKey:
          type: string
          pattern: "^ssh-ed25519 [A-Za-z0-9+/]+={0,2}$"
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../1.1/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../1.1/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../1.1/openapi.yaml#/components/responses/Forbidden" }
    NotFound: { $ref: "../1.1/openapi.yaml#/components/responses/NotFound" }
    Conflict: { $ref: "../1.1/openapi.yaml#/components/responses/Conflict" }
    ValidationFailed: { $ref: "../1.1/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../1.1/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../1.1/openapi.yaml#/components/responses/ServiceUnavailable" }
security:
  - SessionCookie: []
