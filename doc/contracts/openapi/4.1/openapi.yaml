openapi: 3.1.2
info:
  title: J-AXON API
  version: "4.1"
  description: >-
    Minor compatible que conserva OpenAPI 4.0 y añade la conversación técnica
    PUBLIC e INTERNAL para el técnico actualmente asignado.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Identity
  - name: Assets
  - name: Agents
  - name: Support
paths:
  /auth/login:
    $ref: "../4.0/openapi.yaml#/paths/~1auth~1login"
  /auth/me:
    $ref: "../4.0/openapi.yaml#/paths/~1auth~1me"
  /auth/logout:
    $ref: "../4.0/openapi.yaml#/paths/~1auth~1logout"
  /users:
    $ref: "../4.0/openapi.yaml#/paths/~1users"
  /assets:
    $ref: "../4.0/openapi.yaml#/paths/~1assets"
  /assets/{assetId}:
    $ref: "../4.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D"
  /assets/{assetId}/technical-state:
    $ref: "../4.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state"
  /assets/{assetId}/technical-state/events:
    $ref: "../4.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state~1events"
  /agents:
    $ref: "../4.0/openapi.yaml#/paths/~1agents"
  /agents/{agentId}:
    $ref: "../4.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D"
  /agents/{agentId}/ssh-key:
    $ref: "../4.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1ssh-key"
  /agents/{agentId}/activate:
    $ref: "../4.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1activate"
  /agents/{agentId}/tasks:
    $ref: "../4.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks"
  /agents/{agentId}/tasks/{taskId}:
    $ref: "../4.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks~1%7BtaskId%7D"
  /tickets:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets"
  /tickets/technician-queue:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets~1technician-queue"
  /tickets/technician-queue/{ticketId}:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D"
  /tickets/technician-queue/{ticketId}/comments:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1comments"
  /tickets/technician-queue/{ticketId}/conversation:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      tags: [Support]
      operationId: listAssignedTechnicianTicketConversation
      summary: Lista la conversación PUBLIC e INTERNAL del ticket asignado al técnico actual
      parameters:
        - $ref: "#/components/parameters/CommentPage"
        - $ref: "#/components/parameters/CommentPageSize"
      responses:
        "200":
          description: Página conjunta ordenada por creación ascendente e ID ascendente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicianTicketCommentPage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Support]
      operationId: addAssignedTechnicianTicketComment
      summary: Añade un comentario PUBLIC o una nota INTERNAL al ticket asignado
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TechnicianTicketCommentCreateRequest" }
      responses:
        "201":
          description: Comentario y evento TICKET_COMMENT_ADDED persistidos atómicamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TechnicianTicketCommentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /tickets/{ticketId}:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D"
  /tickets/{ticketId}/comments:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1comments"
  /tickets/{ticketId}/claim:
    $ref: "../4.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1claim"
components:
  securitySchemes:
    SessionCookie:
      $ref: "../4.0/openapi.yaml#/components/securitySchemes/SessionCookie"
  parameters:
    CsrfToken:
      $ref: "../4.0/openapi.yaml#/components/parameters/CsrfToken"
    TicketId:
      $ref: "../4.0/openapi.yaml#/components/parameters/TicketId"
    CommentPage:
      $ref: "../4.0/openapi.yaml#/components/parameters/CommentPage"
    CommentPageSize:
      $ref: "../4.0/openapi.yaml#/components/parameters/CommentPageSize"
  schemas:
    UuidV4:
      $ref: "../4.0/openapi.yaml#/components/schemas/UuidV4"
    UtcDateTime:
      $ref: "../4.0/openapi.yaml#/components/schemas/UtcDateTime"
    TechnicianTicketCommentCreateRequest:
      type: object
      required: [visibility, body]
      properties:
        visibility: { type: string, enum: [PUBLIC, INTERNAL] }
        body: { type: string, minLength: 1, maxLength: 10000 }
      additionalProperties: false
    TechnicianTicketCommentResponse:
      type: object
      required: [commentId, ticketId, authorUserId, visibility, body, createdAt]
      properties:
        commentId: { $ref: "#/components/schemas/UuidV4" }
        ticketId: { $ref: "#/components/schemas/UuidV4" }
        authorUserId: { $ref: "#/components/schemas/UuidV4" }
        visibility: { type: string, enum: [PUBLIC, INTERNAL] }
        body: { type: string, minLength: 1, maxLength: 10000 }
        createdAt: { $ref: "#/components/schemas/UtcDateTime" }
      additionalProperties: false
    TechnicianTicketCommentPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TechnicianTicketCommentResponse" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../4.0/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../4.0/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../4.0/openapi.yaml#/components/responses/Forbidden" }
    NotFound: { $ref: "../4.0/openapi.yaml#/components/responses/NotFound" }
    Conflict: { $ref: "../4.0/openapi.yaml#/components/responses/Conflict" }
    ValidationFailed: { $ref: "../4.0/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../4.0/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../4.0/openapi.yaml#/components/responses/ServiceUnavailable" }
security:
  - SessionCookie: []
