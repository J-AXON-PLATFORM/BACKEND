openapi: 3.1.2
info:
  title: J-AXON API
  version: "7.2"
  description: >-
    Versión compatible que conserva OpenAPI 7.1 y añade alta, listado paginado
    y consulta de fuentes documentales de texto para el módulo AI.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Identity
  - name: Assets
  - name: Agents
  - name: Support
  - name: Discovery
  - name: AI
paths:
  /auth/login: { $ref: "../7.1/openapi.yaml#/paths/~1auth~1login" }
  /auth/me: { $ref: "../7.1/openapi.yaml#/paths/~1auth~1me" }
  /auth/logout: { $ref: "../7.1/openapi.yaml#/paths/~1auth~1logout" }
  /users: { $ref: "../7.1/openapi.yaml#/paths/~1users" }
  /assets: { $ref: "../7.1/openapi.yaml#/paths/~1assets" }
  /assets/{assetId}: { $ref: "../7.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D" }
  /assets/{assetId}/technical-state: { $ref: "../7.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state" }
  /assets/{assetId}/technical-state/events: { $ref: "../7.1/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state~1events" }
  /agents: { $ref: "../7.1/openapi.yaml#/paths/~1agents" }
  /agents/{agentId}: { $ref: "../7.1/openapi.yaml#/paths/~1agents~1%7BagentId%7D" }
  /agents/{agentId}/ssh-key: { $ref: "../7.1/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1ssh-key" }
  /agents/{agentId}/activate: { $ref: "../7.1/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1activate" }
  /agents/{agentId}/tasks: { $ref: "../7.1/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks" }
  /agents/{agentId}/tasks/{taskId}: { $ref: "../7.1/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks~1%7BtaskId%7D" }
  /tickets: { $ref: "../7.1/openapi.yaml#/paths/~1tickets" }
  /tickets/technician-queue: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1technician-queue" }
  /tickets/technician-queue/{ticketId}: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D" }
  /tickets/technician-queue/{ticketId}/comments: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1comments" }
  /tickets/technician-queue/{ticketId}/conversation: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1conversation" }
  /tickets/technician-queue/{ticketId}/lifecycle: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1lifecycle" }
  /tickets/{ticketId}: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D" }
  /tickets/{ticketId}/comments: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1comments" }
  /tickets/{ticketId}/claim: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1claim" }
  /tickets/{ticketId}/priority: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1priority" }
  /tickets/{ticketId}/status: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1status" }
  /tickets/{ticketId}/resolve: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1resolve" }
  /tickets/{ticketId}/close: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1close" }
  /tickets/{ticketId}/reopen: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1reopen" }
  /tickets/{ticketId}/lifecycle: { $ref: "../7.1/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1lifecycle" }
  /discovery/scopes: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1scopes" }
  /discovery/scopes/{scopeId}: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1scopes~1%7BscopeId%7D" }
  /discovery/scopes/{scopeId}/status: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1scopes~1%7BscopeId%7D~1status" }
  /discovery/executors: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1executors" }
  /discovery/executors/{executorId}: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D" }
  /discovery/executors/{executorId}/ssh-key: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D~1ssh-key" }
  /discovery/executors/{executorId}/activate: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D~1activate" }
  /discovery/jobs: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1jobs" }
  /discovery/jobs/{jobId}: { $ref: "../7.1/openapi.yaml#/paths/~1discovery~1jobs~1%7BjobId%7D" }
  /discovery-jobs/{jobId}/discovered-devices: { $ref: "../7.1/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/ignore: { $ref: "../7.1/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices~1%7BdiscoveredDeviceId%7D~1ignore" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/incorporate: { $ref: "../7.1/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices~1%7BdiscoveredDeviceId%7D~1incorporate" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/incorporate-new-asset: { $ref: "../7.1/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices~1%7BdiscoveredDeviceId%7D~1incorporate-new-asset" }
  /ai/sources:
    post:
      tags: [AI]
      operationId: createAiSource
      summary: Registra una fuente documental de texto
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AiSourceCreateRequest" }
            encoding:
              file:
                contentType: text/plain
      responses:
        "201":
          description: Fuente almacenada y registrada en estado PENDING
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      tags: [AI]
      operationId: listAiSources
      summary: Lista fuentes documentales por orden de alta descendente
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de fuentes documentales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSourcePage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /ai/sources/{sourceId}:
    get:
      tags: [AI]
      operationId: getAiSource
      summary: Consulta una fuente documental por identificador
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Metadata de la fuente documental
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSource" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    SessionCookie: { $ref: "../7.1/openapi.yaml#/components/securitySchemes/SessionCookie" }
  parameters:
    CsrfToken: { $ref: "../7.1/openapi.yaml#/components/parameters/CsrfToken" }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  schemas:
    AiSourceCreateRequest:
      type: object
      required: [name, file]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        file:
          type: string
          format: binary
          contentMediaType: text/plain
          x-maxBytes: 1048576
      additionalProperties: false
    AiSource:
      type: object
      required: [sourceId, name, mediaType, sizeBytes, sha256, status, version, createdByUserId, createdAt, updatedAt]
      properties:
        sourceId:
          type: string
          format: uuid
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        name: { type: string, minLength: 1, maxLength: 256 }
        mediaType: { type: string, const: text/plain }
        sizeBytes: { type: integer, minimum: 0, maximum: 1048576 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        status: { type: string, const: PENDING }
        version: { type: integer, const: 0 }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    AiSourcePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AiSource" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../7.1/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../7.1/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../7.1/openapi.yaml#/components/responses/Forbidden" }
    NotFound: { $ref: "../7.1/openapi.yaml#/components/responses/NotFound" }
    ValidationFailed: { $ref: "../7.1/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../7.1/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../7.1/openapi.yaml#/components/responses/ServiceUnavailable" }
    PayloadTooLarge:
      description: El archivo supera el máximo de 1 MiB
      content:
        application/problem+json:
          schema: { $ref: "../1.0/openapi.yaml#/components/schemas/Problem" }
security:
  - SessionCookie: []
