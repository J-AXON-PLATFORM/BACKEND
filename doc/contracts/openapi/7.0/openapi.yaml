openapi: 3.1.2
info:
  title: J-AXON API
  version: "7.0"
  description: >-
    Versión major que conserva las operaciones de OpenAPI 6.0, amplía el estado
    observable de Discovered Devices y añade su vinculación individual con un
    activo Inventory existente y ACTIVE por IT_OPERATOR.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Identity
  - name: Assets
  - name: Agents
  - name: Support
  - name: Discovery
paths:
  /auth/login: { $ref: "../6.0/openapi.yaml#/paths/~1auth~1login" }
  /auth/me: { $ref: "../6.0/openapi.yaml#/paths/~1auth~1me" }
  /auth/logout: { $ref: "../6.0/openapi.yaml#/paths/~1auth~1logout" }
  /users: { $ref: "../6.0/openapi.yaml#/paths/~1users" }
  /assets: { $ref: "../6.0/openapi.yaml#/paths/~1assets" }
  /assets/{assetId}: { $ref: "../6.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D" }
  /assets/{assetId}/technical-state: { $ref: "../6.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state" }
  /assets/{assetId}/technical-state/events: { $ref: "../6.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state~1events" }
  /agents: { $ref: "../6.0/openapi.yaml#/paths/~1agents" }
  /agents/{agentId}: { $ref: "../6.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D" }
  /agents/{agentId}/ssh-key: { $ref: "../6.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1ssh-key" }
  /agents/{agentId}/activate: { $ref: "../6.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1activate" }
  /agents/{agentId}/tasks: { $ref: "../6.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks" }
  /agents/{agentId}/tasks/{taskId}: { $ref: "../6.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks~1%7BtaskId%7D" }
  /tickets: { $ref: "../6.0/openapi.yaml#/paths/~1tickets" }
  /tickets/technician-queue: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1technician-queue" }
  /tickets/technician-queue/{ticketId}: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D" }
  /tickets/technician-queue/{ticketId}/comments: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1comments" }
  /tickets/technician-queue/{ticketId}/conversation: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1conversation" }
  /tickets/technician-queue/{ticketId}/lifecycle: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1lifecycle" }
  /tickets/{ticketId}: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D" }
  /tickets/{ticketId}/comments: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1comments" }
  /tickets/{ticketId}/claim: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1claim" }
  /tickets/{ticketId}/priority: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1priority" }
  /tickets/{ticketId}/status: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1status" }
  /tickets/{ticketId}/resolve: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1resolve" }
  /tickets/{ticketId}/close: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1close" }
  /tickets/{ticketId}/reopen: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1reopen" }
  /tickets/{ticketId}/lifecycle: { $ref: "../6.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1lifecycle" }
  /discovery/scopes: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1scopes" }
  /discovery/scopes/{scopeId}: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1scopes~1%7BscopeId%7D" }
  /discovery/scopes/{scopeId}/status: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1scopes~1%7BscopeId%7D~1status" }
  /discovery/executors: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1executors" }
  /discovery/executors/{executorId}: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D" }
  /discovery/executors/{executorId}/ssh-key: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D~1ssh-key" }
  /discovery/executors/{executorId}/activate: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D~1activate" }
  /discovery/jobs: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1jobs" }
  /discovery/jobs/{jobId}: { $ref: "../6.0/openapi.yaml#/paths/~1discovery~1jobs~1%7BjobId%7D" }
  /discovery-jobs/{jobId}/discovered-devices:
    get:
      tags: [Discovery]
      operationId: listDiscoveredDevices
      summary: Lista los dispositivos observados por un Discovery Job
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Página estable de Discovered Devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredDevicePage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/ignore:
    post:
      tags: [Discovery]
      operationId: ignoreDiscoveredDevice
      summary: Marca un Discovered Device individual como ignorado
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/DiscoveredDeviceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveredDeviceIgnoreRequest" }
      responses:
        "200":
          description: Dispositivo ignorado o no-op vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/incorporate:
    post:
      tags: [Discovery]
      operationId: incorporateDiscoveredDevice
      summary: Vincula un Discovered Device individual con un activo ACTIVE existente
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/DiscoveredDeviceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveredDeviceIncorporateRequest" }
      responses:
        "200":
          description: Dispositivo incorporado o no-op vigente para el mismo activo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveredDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    SessionCookie: { $ref: "../6.0/openapi.yaml#/components/securitySchemes/SessionCookie" }
  parameters:
    CsrfToken: { $ref: "../6.0/openapi.yaml#/components/parameters/CsrfToken" }
    JobId: { $ref: "../6.0/openapi.yaml#/components/parameters/JobId" }
    DiscoveredDeviceId: { $ref: "../6.0/openapi.yaml#/components/parameters/DiscoveredDeviceId" }
  schemas:
    DiscoveredDeviceIgnoreRequest: { $ref: "../6.0/openapi.yaml#/components/schemas/DiscoveredDeviceIgnoreRequest" }
    DiscoveredDeviceIncorporateRequest:
      type: object
      required: [assetId, expectedVersion]
      properties:
        assetId: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" }
        expectedVersion: { type: integer, minimum: 0 }
      additionalProperties: false
    DiscoveredDevice:
      type: object
      required:
        - discoveredDeviceId
        - jobId
        - status
        - version
        - reviewedAt
        - assetId
        - ipAddress
        - macAddress
        - hostname
        - evidence
        - openTcpPorts
        - observedAt
      properties:
        discoveredDeviceId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [UNREVIEWED, IGNORED, INCORPORATED] }
        version: { type: integer, minimum: 0 }
        reviewedAt: { type: [string, "null"], format: date-time }
        assetId: { type: [string, "null"], format: uuid }
        ipAddress:
          type: string
          anyOf: [{ format: ipv4 }, { format: ipv6 }]
        macAddress:
          type: [string, "null"]
          pattern: "^[0-9a-f]{2}(?::[0-9a-f]{2}){5}$"
        hostname: { type: [string, "null"], minLength: 1, maxLength: 253 }
        evidence:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { enum: [ARP, ICMP, TCP] }
        openTcpPorts:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { enum: [22, 53, 80, 443, 445, 3389] }
        observedAt: { type: string, format: date-time }
      oneOf:
        - required: [status, version, reviewedAt, assetId]
          properties:
            status: { const: UNREVIEWED }
            version: { const: 0 }
            reviewedAt: { type: "null" }
            assetId: { type: "null" }
        - required: [status, version, reviewedAt, assetId]
          properties:
            status: { const: IGNORED }
            version: { const: 1 }
            reviewedAt: { type: string, format: date-time }
            assetId: { type: "null" }
        - required: [status, version, reviewedAt, assetId]
          properties:
            status: { const: INCORPORATED }
            version: { const: 1 }
            reviewedAt: { type: string, format: date-time }
            assetId: { type: string, format: uuid }
      additionalProperties: false
    DiscoveredDevicePage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DiscoveredDevice" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../6.0/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../6.0/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../6.0/openapi.yaml#/components/responses/Forbidden" }
    NotFound: { $ref: "../6.0/openapi.yaml#/components/responses/NotFound" }
    Conflict: { $ref: "../6.0/openapi.yaml#/components/responses/Conflict" }
    ValidationFailed: { $ref: "../6.0/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../6.0/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../6.0/openapi.yaml#/components/responses/ServiceUnavailable" }
security:
  - SessionCookie: []
