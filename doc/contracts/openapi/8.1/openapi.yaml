openapi: 3.1.2
info:
  title: J-AXON API
  version: "8.1"
  description: >-
    Versión compatible que conserva byte a byte las operaciones de OpenAPI 8.0 y
    añade únicamente la recuperación vectorial autorizada sobre fuentes AI READY.
servers:
  - url: /api/v1
tags:
  - { name: Authentication }
  - { name: Identity }
  - { name: Assets }
  - { name: Agents }
  - { name: Support }
  - { name: Discovery }
  - { name: AI }
paths:
  /auth/login: { $ref: "../8.0/openapi.yaml#/paths/~1auth~1login" }
  /auth/me: { $ref: "../8.0/openapi.yaml#/paths/~1auth~1me" }
  /auth/logout: { $ref: "../8.0/openapi.yaml#/paths/~1auth~1logout" }
  /users: { $ref: "../8.0/openapi.yaml#/paths/~1users" }
  /assets: { $ref: "../8.0/openapi.yaml#/paths/~1assets" }
  /assets/{assetId}: { $ref: "../8.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D" }
  /assets/{assetId}/technical-state: { $ref: "../8.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state" }
  /assets/{assetId}/technical-state/events: { $ref: "../8.0/openapi.yaml#/paths/~1assets~1%7BassetId%7D~1technical-state~1events" }
  /agents: { $ref: "../8.0/openapi.yaml#/paths/~1agents" }
  /agents/{agentId}: { $ref: "../8.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D" }
  /agents/{agentId}/ssh-key: { $ref: "../8.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1ssh-key" }
  /agents/{agentId}/activate: { $ref: "../8.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1activate" }
  /agents/{agentId}/tasks: { $ref: "../8.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks" }
  /agents/{agentId}/tasks/{taskId}: { $ref: "../8.0/openapi.yaml#/paths/~1agents~1%7BagentId%7D~1tasks~1%7BtaskId%7D" }
  /tickets: { $ref: "../8.0/openapi.yaml#/paths/~1tickets" }
  /tickets/technician-queue: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1technician-queue" }
  /tickets/technician-queue/{ticketId}: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D" }
  /tickets/technician-queue/{ticketId}/comments: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1comments" }
  /tickets/technician-queue/{ticketId}/conversation: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1conversation" }
  /tickets/technician-queue/{ticketId}/lifecycle: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1technician-queue~1%7BticketId%7D~1lifecycle" }
  /tickets/{ticketId}: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D" }
  /tickets/{ticketId}/comments: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1comments" }
  /tickets/{ticketId}/claim: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1claim" }
  /tickets/{ticketId}/priority: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1priority" }
  /tickets/{ticketId}/status: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1status" }
  /tickets/{ticketId}/resolve: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1resolve" }
  /tickets/{ticketId}/close: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1close" }
  /tickets/{ticketId}/reopen: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1reopen" }
  /tickets/{ticketId}/lifecycle: { $ref: "../8.0/openapi.yaml#/paths/~1tickets~1%7BticketId%7D~1lifecycle" }
  /discovery/scopes: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1scopes" }
  /discovery/scopes/{scopeId}: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1scopes~1%7BscopeId%7D" }
  /discovery/scopes/{scopeId}/status: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1scopes~1%7BscopeId%7D~1status" }
  /discovery/executors: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1executors" }
  /discovery/executors/{executorId}: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D" }
  /discovery/executors/{executorId}/ssh-key: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D~1ssh-key" }
  /discovery/executors/{executorId}/activate: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1executors~1%7BexecutorId%7D~1activate" }
  /discovery/jobs: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1jobs" }
  /discovery/jobs/{jobId}: { $ref: "../8.0/openapi.yaml#/paths/~1discovery~1jobs~1%7BjobId%7D" }
  /discovery-jobs/{jobId}/discovered-devices: { $ref: "../8.0/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/ignore: { $ref: "../8.0/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices~1%7BdiscoveredDeviceId%7D~1ignore" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/incorporate: { $ref: "../8.0/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices~1%7BdiscoveredDeviceId%7D~1incorporate" }
  /discovery-jobs/{jobId}/discovered-devices/{discoveredDeviceId}/incorporate-new-asset: { $ref: "../8.0/openapi.yaml#/paths/~1discovery-jobs~1%7BjobId%7D~1discovered-devices~1%7BdiscoveredDeviceId%7D~1incorporate-new-asset" }
  /ai/sources: { $ref: "../8.0/openapi.yaml#/paths/~1ai~1sources" }
  /ai/sources/{sourceId}: { $ref: "../8.0/openapi.yaml#/paths/~1ai~1sources~1%7BsourceId%7D" }
  /ai/sources/{sourceId}/index: { $ref: "../8.0/openapi.yaml#/paths/~1ai~1sources~1%7BsourceId%7D~1index" }
  /ai/retrieval:
    post:
      tags: [AI]
      operationId: retrieveAiChunks
      summary: Recupera fragmentos trazables de fuentes AI READY por similitud vectorial
      description: >-
        Operación de lectura exclusiva para SYSTEM_ADMIN. Calcula el embedding de la
        consulta con el modelo local fijado y devuelve, en orden estable de similitud
        descendente, sourceId ascendente y ordinal ascendente, únicamente fragmentos de
        fuentes READY indexadas con el mismo modelo, revisión y tokenizer. No genera
        texto, no persiste la consulta y no emite eventos. Sin evidencia devuelve una
        lista vacía.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRetrievalRequest" }
      responses:
        "200":
          description: Fragmentos recuperados, posiblemente ninguno
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRetrievalResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    SessionCookie: { $ref: "../8.0/openapi.yaml#/components/securitySchemes/SessionCookie" }
  parameters:
    CsrfToken: { $ref: "../8.0/openapi.yaml#/components/parameters/CsrfToken" }
  schemas:
    AiRetrievalRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Consulta en texto. Se recortan en ambos extremos espacios Unicode y caracteres de
            control o de formato; el resultado debe ser no vacío y tener entre 1 y 480 tokens
            del modelo. Claves JSON duplicadas se rechazan.
        limit: { type: integer, minimum: 1, maximum: 10, default: 5 }
      additionalProperties: false
    AiRetrievalResponse:
      type: object
      required: [limit, results]
      properties:
        limit: { type: integer, minimum: 1, maximum: 10 }
        results:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AiRetrievalResult" }
      additionalProperties: false
    AiRetrievalResult:
      type: object
      required: [sourceId, sourceName, sourceSha256, chunkId, ordinal, startToken, endToken, contentSha256, content, similarity]
      properties:
        sourceId: { $ref: "../7.2/openapi.yaml#/components/schemas/AiSource/properties/sourceId" }
        sourceName: { type: string, minLength: 1, maxLength: 256 }
        sourceSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        chunkId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 0 }
        startToken: { type: integer, minimum: 0 }
        endToken: { type: integer, minimum: 1 }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        content: { type: string, minLength: 1 }
        similarity: { type: number, minimum: -1, maximum: 1 }
      additionalProperties: false
  responses:
    BadRequest: { $ref: "../8.0/openapi.yaml#/components/responses/BadRequest" }
    AuthenticationRequired: { $ref: "../8.0/openapi.yaml#/components/responses/AuthenticationRequired" }
    Forbidden: { $ref: "../8.0/openapi.yaml#/components/responses/Forbidden" }
    ValidationFailed: { $ref: "../8.0/openapi.yaml#/components/responses/ValidationFailed" }
    InternalError: { $ref: "../8.0/openapi.yaml#/components/responses/InternalError" }
    ServiceUnavailable: { $ref: "../8.0/openapi.yaml#/components/responses/ServiceUnavailable" }
security:
  - SessionCookie: []
