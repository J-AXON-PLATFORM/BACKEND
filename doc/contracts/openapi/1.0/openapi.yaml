openapi: 3.1.2
info:
  title: J-AXON API
  version: "1.0"
  description: >-
    Contrato inicial de la primera vertical. Define fronteras REST, no acredita
    que existan controladores o persistencia implementados.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Assets
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Inicia una sesión humana opaca
      description: >-
        Autentica sin revelar si el usuario existe, está deshabilitado o la
        contraseña es incorrecta. La sesión se mantiene server-side.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: >-
                Cookie de sesión opaca __Host-JAXON_SESSION; HttpOnly; Secure;
                SameSite=Strict; Path=/; sin atributo Domain ni persistencia.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: Consulta la sesión humana actual
      responses:
        "200":
          description: Sesión actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /assets:
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Crea la ficha oficial mínima de un activo
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreateRequest"
      responses:
        "201":
          description: Activo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Consulta la ficha oficial de un activo
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Ficha oficial del activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /assets/{assetId}/technical-state:
    get:
      tags: [Assets]
      operationId: getAssetTechnicalState
      summary: Consulta el estado técnico observado de un activo
      description: >-
        La respuesta distingue la referencia a la ficha oficial del activo de
        la observación técnica mantenida por Collector.
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Estado técnico observado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechnicalStateResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-JAXON_SESSION
      description: Sesión humana opaca almacenada server-side; nunca JWT.
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token recibido en SessionResponse; no se conserva en ejemplos.
      schema:
        type: string
        minLength: 32
        maxLength: 512
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    UtcDateTime:
      type: string
      format: date-time
      pattern: "Z$"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
      additionalProperties: false
    SessionResponse:
      type: object
      required: [userId, username, roles, csrfToken, expiresAt]
      properties:
        userId:
          $ref: "#/components/schemas/UuidV4"
        username:
          type: string
          minLength: 1
          maxLength: 128
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - SYSTEM_ADMIN
              - IT_OPERATOR
              - SUPPORT_TECHNICIAN
              - END_USER
              - AUDITOR
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Valor sensible de sesión; se omite de ejemplos.
        expiresAt:
          $ref: "#/components/schemas/UtcDateTime"
      additionalProperties: false
    AssetCreateRequest:
      type: object
      required: [name, assetType, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        assetType:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: Código del catálogo administrable AssetType.
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
      additionalProperties: false
    AssetResponse:
      type: object
      required: [assetId, name, assetType, status, createdAt, updatedAt, version]
      properties:
        assetId:
          $ref: "#/components/schemas/UuidV4"
        name:
          type: string
          minLength: 1
          maxLength: 256
        assetType:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]*$"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        assetTag:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
        serialNumber:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
        manufacturer:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
        model:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
        responsibleUserId:
          oneOf:
            - $ref: "#/components/schemas/UuidV4"
            - type: "null"
        locationLabel:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
        createdAt:
          $ref: "#/components/schemas/UtcDateTime"
        updatedAt:
          $ref: "#/components/schemas/UtcDateTime"
        version:
          type: integer
          minimum: 0
      additionalProperties: false
    OperatingSystemObservation:
      type: object
      required: [family, name, version]
      properties:
        family:
          type: string
          enum: [WINDOWS, LINUX, MACOS, OTHER]
        name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    StorageVolumeObservation:
      type: object
      required: [name, totalBytes, availableBytes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        totalBytes:
          type: integer
          minimum: 0
        availableBytes:
          type: integer
          minimum: 0
      additionalProperties: false
    TechnicalObservation:
      type: object
      required:
        - snapshotId
        - capturedAt
        - hostname
        - operatingSystem
        - architecture
        - logicalCpuCount
        - memoryBytes
        - storageVolumes
      properties:
        snapshotId:
          $ref: "#/components/schemas/UuidV4"
        capturedAt:
          $ref: "#/components/schemas/UtcDateTime"
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        operatingSystem:
          $ref: "#/components/schemas/OperatingSystemObservation"
        architecture:
          type: string
          enum: [X86_64, X86, ARM64, ARM32, OTHER]
        logicalCpuCount:
          type: integer
          minimum: 1
        memoryBytes:
          type: integer
          minimum: 0
        storageVolumes:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/StorageVolumeObservation"
      additionalProperties: false
    TechnicalStateResponse:
      type: object
      required: [assetId, lastSeenAt, lastSnapshotAt, latestObservation]
      properties:
        assetId:
          $ref: "#/components/schemas/UuidV4"
        lastSeenAt:
          oneOf:
            - $ref: "#/components/schemas/UtcDateTime"
            - type: "null"
        lastSnapshotAt:
          oneOf:
            - $ref: "#/components/schemas/UtcDateTime"
            - type: "null"
        latestObservation:
          oneOf:
            - $ref: "#/components/schemas/TechnicalObservation"
            - type: "null"
      additionalProperties: false
    FieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, correlationId, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 512
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
        correlationId:
          $ref: "#/components/schemas/UuidV4"
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldError"
      additionalProperties: false
  responses:
    BadRequest:
      description: Solicitud mal formada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthenticationFailed:
      description: Credenciales no válidas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthenticationRequired:
      description: Se requiere una sesión válida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: La sesión no autoriza la operación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicto con el estado actual
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: La solicitud no cumple las reglas de validación
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Límite de autenticación excedido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Error interno seguro
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Servicio temporalmente no disponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
security:
  - SessionCookie: []
