name: jaxon-local

services:
  database:
    image: ${JAXON_DATABASE_IMAGE:-jaxon-postgres-pgvector-test:18.6-0.8.6}
    build:
      context: .
      dockerfile: docker/postgres-pgvector.Dockerfile
    environment:
      POSTGRES_DB: ${JAXON_DB_NAME:?Set JAXON_DB_NAME in .env}
      POSTGRES_PASSWORD: ${JAXON_DB_PASSWORD:?Set JAXON_DB_PASSWORD in .env}
      POSTGRES_USER: ${JAXON_DB_USERNAME:?Set JAXON_DB_USERNAME in .env}
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$${POSTGRES_USER}\" --dbname \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - name: postgres
        target: 5432
        published: "${JAXON_DB_HOST_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - jaxon-postgres-data:/var/lib/postgresql
    networks:
      - jaxon-local

  backend:
    profiles: ["application"]
    image: ${JAXON_BACKEND_IMAGE:-jaxon-backend:local}
    build:
      context: .
      args:
        VCS_REF: local
    depends_on:
      database:
        condition: service_healthy
    environment:
      JAXON_DB_PASSWORD: ${JAXON_DB_PASSWORD:?Set JAXON_DB_PASSWORD in .env}
      JAXON_DB_URL: jdbc:postgresql://database:5432/${JAXON_DB_NAME:?Set JAXON_DB_NAME in .env}
      JAXON_DB_USERNAME: ${JAXON_DB_USERNAME:?Set JAXON_DB_USERNAME in .env}
      JAXON_ENVIRONMENT: ${JAXON_ENVIRONMENT:?Set JAXON_ENVIRONMENT in .env}
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
    ports:
      - name: http
        target: 8080
        published: "${JAXON_BACKEND_HOST_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    networks:
      - jaxon-local

volumes:
  jaxon-postgres-data:
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}

networks:
  jaxon-local:
    driver: bridge
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
