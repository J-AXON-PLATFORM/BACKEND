name: jaxon-local

services:
  database:
    image: ${JAXON_DATABASE_IMAGE:-jaxon-postgres-pgvector-test:18.6-0.8.6}
    build:
      context: .
      dockerfile: docker/postgres-pgvector.Dockerfile
    environment:
      POSTGRES_DB: ${JAXON_DB_NAME:?Set JAXON_DB_NAME in .env}
      POSTGRES_PASSWORD: ${JAXON_DB_PASSWORD:?Set JAXON_DB_PASSWORD in .env}
      POSTGRES_USER: ${JAXON_DB_USERNAME:?Set JAXON_DB_USERNAME in .env}
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$${POSTGRES_USER}\" --dbname \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - name: postgres
        target: 5432
        published: "${JAXON_DB_HOST_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - jaxon-postgres-data:/var/lib/postgresql
    networks:
      - jaxon-local

  sftpgo:
    image: ${JAXON_SFTPGO_IMAGE:-jaxon-sftpgo:2.7.6-local}
    build:
      context: .
      dockerfile: docker/sftpgo/Dockerfile
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_COMMON__UMASK: "0027"
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${JAXON_SFTPGO_ADMIN_PASSWORD:?Set JAXON_SFTPGO_ADMIN_PASSWORD in .env}
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${JAXON_SFTPGO_ADMIN_USERNAME:?Set JAXON_SFTPGO_ADMIN_USERNAME in .env}
      SFTPGO_SFTPD__ENABLED_SSH_COMMANDS: ""
      SFTPGO_SFTPD__KEYBOARD_INTERACTIVE_AUTHENTICATION: "false"
      SFTPGO_SFTPD__PASSWORD_AUTHENTICATION: "false"
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
    healthcheck:
      test: ["CMD", "/usr/local/bin/sftpgo", "ping", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - name: sftp
        target: 2022
        published: "${JAXON_SFTP_HOST_PORT:-2022}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - jaxon-sftpgo-data:/var/lib/sftpgo
      - jaxon-sftpgo-mailboxes:/srv/sftpgo/data
    networks:
      - jaxon-local

  backend:
    profiles: ["application"]
    image: ${JAXON_BACKEND_IMAGE:-jaxon-backend:local}
    build:
      context: .
      args:
        VCS_REF: local
    depends_on:
      database:
        condition: service_healthy
      sftpgo:
        condition: service_healthy
    environment:
      JAXON_DB_PASSWORD: ${JAXON_DB_PASSWORD:?Set JAXON_DB_PASSWORD in .env}
      JAXON_DB_URL: jdbc:postgresql://database:5432/${JAXON_DB_NAME:?Set JAXON_DB_NAME in .env}
      JAXON_DB_USERNAME: ${JAXON_DB_USERNAME:?Set JAXON_DB_USERNAME in .env}
      JAXON_COLLECTOR_MAILBOX_ROOT: /srv/sftpgo/data
      JAXON_COLLECTOR_RECONCILIATION_INTERVAL: ${JAXON_COLLECTOR_RECONCILIATION_INTERVAL:-4m}
      JAXON_COLLECTOR_SNAPSHOT_BATCH_SIZE: ${JAXON_COLLECTOR_SNAPSHOT_BATCH_SIZE:-100}
      JAXON_COLLECTOR_SNAPSHOT_STABILITY_AGE: ${JAXON_COLLECTOR_SNAPSHOT_STABILITY_AGE:-2s}
      JAXON_ENVIRONMENT: ${JAXON_ENVIRONMENT:?Set JAXON_ENVIRONMENT in .env}
      JAXON_FRONTEND_ORIGIN: ${JAXON_FRONTEND_ORIGIN:-http://localhost:3000}
      JAXON_IDENTITY_BOOTSTRAP_ENABLED: ${JAXON_IDENTITY_BOOTSTRAP_ENABLED:-false}
      JAXON_IDENTITY_BOOTSTRAP_PASSWORD: ${JAXON_IDENTITY_BOOTSTRAP_PASSWORD:-}
      JAXON_IDENTITY_BOOTSTRAP_USERNAME: ${JAXON_IDENTITY_BOOTSTRAP_USERNAME:-}
      JAXON_LOG_FORMAT: ${JAXON_LOG_FORMAT:-logstash}
      JAXON_SFTP_ENABLED: ${JAXON_SFTP_ENABLED:-false}
      JAXON_SFTPGO_ADMIN_API_URL: http://sftpgo:8080/api/v2
      JAXON_SFTPGO_ADMIN_PASSWORD: ${JAXON_SFTPGO_ADMIN_PASSWORD:?Set JAXON_SFTPGO_ADMIN_PASSWORD in .env}
      JAXON_SFTPGO_ADMIN_USERNAME: ${JAXON_SFTPGO_ADMIN_USERNAME:?Set JAXON_SFTPGO_ADMIN_USERNAME in .env}
      JAXON_SFTP_PUBLIC_HOST: ${JAXON_SFTP_PUBLIC_HOST:-127.0.0.1}
      JAXON_SFTP_PUBLIC_HOST_KEY: ${JAXON_SFTP_PUBLIC_HOST_KEY:-}
      JAXON_SFTP_PUBLIC_PORT: ${JAXON_SFTP_PUBLIC_PORT:-2022}
      JAXON_TRACING_EXPORT_OTLP_ENABLED: ${JAXON_TRACING_EXPORT_OTLP_ENABLED:-false}
      JAXON_TRACING_OTLP_ENDPOINT: ${JAXON_TRACING_OTLP_ENDPOINT:-http://127.0.0.1:4318/v1/traces}
      JAXON_TRACING_OTLP_TIMEOUT: ${JAXON_TRACING_OTLP_TIMEOUT:-5s}
      JAXON_TRACING_SAMPLING_PROBABILITY: ${JAXON_TRACING_SAMPLING_PROBABILITY:-0.10}
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
    ports:
      - name: http
        target: 8080
        published: "${JAXON_BACKEND_HOST_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    read_only: true
    group_add:
      - "65532"
    volumes:
      - jaxon-sftpgo-mailboxes:/srv/sftpgo/data:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    networks:
      - jaxon-local

volumes:
  jaxon-postgres-data:
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
  jaxon-sftpgo-data:
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
  jaxon-sftpgo-mailboxes:
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}

networks:
  jaxon-local:
    driver: bridge
    labels:
      com.jaxon.resource-owner: ${JAXON_RESOURCE_OWNER:-local-persistent}
